name: ci

on: pull_request

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_UI: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # O typedRoutes só fica estrito com apps/web/.next/types. O varlock do
      # next exige as variáveis obrigatórias do .env.schema; aqui vão valores
      # de mentira, porque o typegen não fala com Clerk nem com o banco.
      - name: next typegen
        working-directory: apps/web
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ci-sem-clerk
          CLERK_PUBLISHABLE_KEY: ci-sem-clerk
          CLERK_SECRET_KEY: ci-sem-clerk
          CORS_ORIGIN: http://localhost:3001
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: bunx next typegen

      - run: bun run check-types

      - run: bun run check

      # Os *.integration.test.* pedem o Postgres local (TEST_DATABASE_URL) e
      # ficam fora. As suítes que medem no Chromium pulam: o runner tem
      # /usr/bin/chromium, mas o AppArmor do Ubuntu 24.04 o derruba com
      # "No usable sandbox", e o CHROMIUM sem binário faz o skipIf delas valer.
      - run: bun run test -- -- '--path-ignore-patterns=**/*.integration.test.*'
        env:
          CHROMIUM: /nao-existe/chromium
